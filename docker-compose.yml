version: '3.8'

services:
  easydrop:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: easydrop
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - NODE_ENV=production
    volumes:
      # 持久化存储目录 (所有上传文件、记录元数据均保存在此)
      - ./data:/app/data
